<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eletrotok - Entrar</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-card">
    <img src="img/logo-eletrotok.png" alt="Eletrotok" class="login-logo" />

    <h1>Entrar</h1>
    <p class="login-subtitulo">Acesse com seu login e senha cadastrados.</p>

    <form id="form-login">
      <label>
        Login
        <input type="text" name="login" autocomplete="username" required autofocus />
      </label>
      <label>
        Senha
        <input type="password" name="senha" autocomplete="current-password" required />
      </label>

      <div id="mensagem-login" class="mensagem" hidden></div>

      <button type="submit" id="btn-entrar">Entrar</button>
    </form>
  </div>

  <script src="js/shared/api.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
