<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eletrotok - Produtos</title>
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/produto-form.css" />
  <link rel="stylesheet" href="css/produtos-lista.css" />
</head>
<body>
  <div id="app-sidebar"></div>

  <div id="app-conteudo">
    <div id="app-topbar"></div>
    <div id="app-faixa-contexto" class="faixa-contexto" hidden></div>

    <main id="app-main">
      <div class="pagina-cabecalho">
        <div class="pagina-cabecalho-titulo">
          <div class="pagina-cabecalho-icone" id="icone-pagina"></div>
          <div>
            <h1>Produtos</h1>
            <p>Gerencie seu catálogo de produtos.</p>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="breadcrumb">
            <a href="index.html">Início</a> &gt; <strong>Produtos</strong> &gt; Listar
          </div>
          <button type="button" class="botao secundario" id="btn-exportar-produtos"><span id="icone-exportar"></span> Exportar</button>
          <a href="importar-produtos.html" class="botao secundario"><span id="icone-importar"></span> Importar produtos</a>
        </div>
      </div>

      <div class="cards-resumo">
        <div class="card-resumo">
          <div class="card-resumo-icone azul" id="icone-total"></div>
          <div>
            <p class="card-resumo-titulo">Total de produtos</p>
            <p class="card-resumo-valor" id="valor-total">0</p>
          </div>
        </div>
        <div class="card-resumo">
          <div class="card-resumo-icone verde" id="icone-ativos"></div>
          <div>
            <p class="card-resumo-titulo">Produtos ativos</p>
            <p class="card-resumo-valor" id="valor-ativos">0</p>
          </div>
        </div>
        <div class="card-resumo">
          <div class="card-resumo-icone vermelho" id="icone-inativos"></div>
          <div>
            <p class="card-resumo-titulo">Produtos inativos</p>
            <p class="card-resumo-valor" id="valor-inativos">0</p>
          </div>
        </div>
        <div class="card-resumo">
          <div class="card-resumo-icone roxo" id="icone-categorias"></div>
          <div>
            <p class="card-resumo-titulo">Categorias</p>
            <p class="card-resumo-valor" id="valor-categorias">0</p>
          </div>
        </div>
      </div>

      <div class="painel-form">
        <div class="barra-filtros">
          <div class="campo-busca-lista">
            <span id="icone-busca"></span>
            <input type="text" id="campo-busca" placeholder="Buscar por nome, código, marca, categoria..." />
          </div>
          <label class="campo-filtro">Categoria
            <select id="filtro-categoria"><option value="">Todas</option></select>
          </label>
          <label class="campo-filtro">Marca
            <select id="filtro-marca"><option value="">Todas</option></select>
          </label>
          <label class="campo-filtro">Status
            <select id="filtro-status">
              <option value="">Todos</option>
              <option value="1">Ativo</option>
              <option value="0">Inativo</option>
            </select>
          </label>
          <button type="button" class="botao secundario" id="btn-limpar-filtros">
            <span id="icone-limpar"></span> Limpar filtros
          </button>
          <a href="produto-form.html" class="botao primario">
            <span id="icone-novo"></span> Novo produto
          </a>
        </div>
      </div>

      <div class="painel-form">
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Imagem</th>
                <th>Código</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Marca</th>
                <th>Preço (Varejo)</th>
                <th>Preço (Atacado)</th>
                <th>Estoque total</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
          </table>
        </div>
        <div class="rodape-tabela">
          <span id="texto-paginacao"></span>
          <div class="paginacao" id="paginacao"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/layout.js"></script>
  <script>initLayout('produtos');</script>
  <script src="js/pages/produtos.js"></script>
</body>
</html>
