<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eletrotok - Fornecedores</title>
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/produto-form.css" />
  <link rel="stylesheet" href="css/produtos-lista.css" />
  <link rel="stylesheet" href="css/pdv.css" />
</head>
<body>
  <div id="app-sidebar"></div>

  <div id="app-conteudo">
    <div id="app-topbar"></div>
    <div id="app-faixa-contexto" class="faixa-contexto" hidden></div>

    <main id="app-main">
      <div class="pagina-cabecalho">
        <div class="pagina-cabecalho-titulo">
          <div class="pagina-cabecalho-icone" id="icone-pagina"></div>
          <div>
            <h1>Fornecedores</h1>
            <p>Cadastro de fornecedores e histórico de compras.</p>
          </div>
        </div>
        <div class="breadcrumb">
          <a href="index.html">Início</a> &gt; <strong>Fornecedores</strong>
        </div>
      </div>

      <div class="cards-resumo">
        <div class="card-resumo">
          <div class="card-resumo-icone azul" id="icone-total"></div>
          <div class="card-resumo-corpo"><p class="card-resumo-titulo">Total de fornecedores</p><p class="card-resumo-valor" id="valor-total">0</p></div>
        </div>
        <div class="card-resumo">
          <div class="card-resumo-icone verde" id="icone-ativos"></div>
          <div class="card-resumo-corpo"><p class="card-resumo-titulo">Ativos</p><p class="card-resumo-valor" id="valor-ativos">0</p></div>
        </div>
      </div>

      <div class="painel-form">
        <p class="painel-form-titulo"><span id="icone-form"></span> <span id="titulo-form">Novo fornecedor</span></p>
        <form id="form-fornecedor">
          <div class="grid-campos">
            <label class="campo largo">Razão social *
              <input type="text" name="razao_social" required />
            </label>
            <label class="campo">CNPJ
              <input type="text" name="cnpj" />
            </label>
            <label class="campo">Nome do contato
              <input type="text" name="contato_nome" />
            </label>
            <label class="campo">Telefone do contato
              <input type="text" name="contato_telefone" />
            </label>
            <label class="campo">E-mail do contato
              <input type="text" name="contato_email" />
            </label>
            <label class="campo largo">Condições de pagamento
              <input type="text" name="condicoes_pagamento" placeholder="Ex: 30/60/90 dias" />
            </label>
          </div>
          <div class="barra-acoes-formulario" style="margin-top:16px;">
            <button type="button" class="botao secundario" id="btn-cancelar-edicao" hidden>Cancelar edição</button>
            <button type="submit" class="botao primario" style="margin-left:auto;"><span id="icone-salvar"></span> Salvar fornecedor</button>
          </div>
          <div class="mensagem" id="mensagem-fornecedor"></div>
        </form>
      </div>

      <div class="pdv-layout">
        <div class="painel-form">
          <p class="painel-form-titulo">Fornecedores cadastrados</p>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Razão social</th>
                  <th>CNPJ</th>
                  <th>Contato</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-fornecedores"></tbody>
            </table>
          </div>
        </div>

        <div class="painel-form" id="painel-historico">
          <p class="painel-form-titulo">Histórico de compras</p>
          <p style="color:var(--text-secundario); font-size:13px;">Selecione um fornecedor na lista para ver o histórico.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/layout.js"></script>
  <script>initLayout('fornecedores');</script>
  <script src="js/pages/fornecedores.js"></script>
</body>
</html>
